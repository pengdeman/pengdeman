<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengdeman - Spring Boot Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 36px;
            color: white;
            font-weight: bold;
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
        }

        .info-card {
            background: #f7f9fc;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e8ecf1;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;
            font-weight: 500;
        }

        .info-value {
            color: #333;
            font-weight: 600;
            font-family: 'Monaco', 'Menlo', monospace;
            background: white;
            padding: 4px 12px;
            border-radius: 6px;
        }

        .api-section {
            margin-top: 40px;
        }

        .api-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            text-align: left;
        }

        .api-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .api-link {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .api-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #d4edda;
            color: #155724;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #28a745;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e8ecf1;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">P</div>
        <h1>Pengdeman</h1>
        <p class="subtitle">Spring Boot Application</p>

        <div class="status">
            <span class="status-dot"></span>
            服务运行中
        </div>

        <div class="info-card">
            <div class="info-row">
                <span class="info-label">访问地址</span>
                <span class="info-value" id="hostUrl">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">IP 地址</span>
                <span class="info-value" id="ipAddress">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">端口号</span>
                <span class="info-value" id="portNumber">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">应用名称</span>
                <span class="info-value">pengdeman</span>
            </div>
            <div class="info-row">
                <span class="info-label">版本号</span>
                <span class="info-value">1.0.0</span>
            </div>
        </div>

        <div class="api-section">
            <h3 class="api-title">API 端点</h3>
            <div class="api-links">
                <a href="/api/demo/welcome" class="api-link">/api/demo/welcome</a>
                <a href="/api/demo/count/10" class="api-link">/api/demo/count/10</a>
                <a href="/api/demo" class="api-link">/api/demo</a>
                <a href="/actuator/health" class="api-link">/actuator/health</a>
                <a href="/actuator/info" class="api-link">/actuator/info</a>
                <a href="/h2-console" class="api-link">H2 Console</a>
            </div>
        </div>

        <div class="footer">
            Powered by Spring Boot 2.7.17
        </div>
    </div>

    <script>
        // 获取并显示访问信息
        document.addEventListener('DOMContentLoaded', function() {
            const protocol = window.location.protocol;
            const hostname = window.location.hostname;
            const port = window.location.port || (protocol === 'https:' ? '443' : '80');

            document.getElementById('hostUrl').textContent = window.location.origin;
            document.getElementById('ipAddress').textContent = hostname;
            document.getElementById('portNumber').textContent = port;
        });
    </script>
</body>
</html>
