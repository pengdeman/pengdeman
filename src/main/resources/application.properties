# 应用程序基本配置
server.port=8080
spring.application.name=pengdeman

# 微信小程序配置
# 请替换为你的小程序实际配置
wechat.miniapp.app-id=your-app-id
wechat.miniapp.app-secret=your-app-secret
wechat.miniapp.code2-session-url=https://api.weixin.qq.com/sns/jscode2session

# JWT配置
jwt.secret=my-secret-key-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=604800000

# H2数据库配置
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2控制台配置（开发环境）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 日志配置
logging.level.com.pengdeman=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator监控端点配置
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Jackson配置
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL