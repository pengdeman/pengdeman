# 应用程序基本配置
server.address=0.0.0.0
spring.application.name=pengdeman

# HTTP配置（开发环境使用HTTP）
#server.port=8080
#server.ssl.enabled=false

# HTTPS SSL配置（生产环境启用）
server.port=443
server.ssl.enabled=true
# 证书文件名，请替换为你的实际证书文件名
server.ssl.key-store=classpath:www.mmmmmmmm.vip.pfx
# 证书格式，p12或jks
server.ssl.key-store-type=PKCS12
# 证书密码，已提供
server.ssl.key-store-password=4gq6dkta
# 证书别名，已自动获取到正确别名
server.ssl.key-alias=www.mmmmmmmm.vip
# 密钥密码，通常和keystore密码相同
server.ssl.key-password=1xbv6eq8

# 可选：配置HTTP端口80自动跳转到HTTPS 443端口
# 需要额外添加配置类实现，如需启用请告知

# 微信小程序配置
# 请替换为你的小程序实际配置
wechat.miniapp.app-id=wx61786d750d7a02ac
wechat.miniapp.app-secret=d2df6bc38477ccbfff32fe5dbe1345da
wechat.miniapp.code2-session-url=https://api.weixin.qq.com/sns/jscode2session

# JWT配置
jwt.secret=my-secret-key-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=604800000

# H2数据库配置（文件模式，重启数据不丢失）
spring.datasource.url=jdbc:h2:file:./data/pengdeman;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2控制台配置（开发环境，生产环境建议关闭）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 日志配置
logging.level.com.pengdeman=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.file.name=logs/pengdeman.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Actuator监控端点配置
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Jackson配置
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# 允许循环依赖
spring.main.allow-circular-references=true

# 静态资源配置
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ========== 京东联盟配置 ==========
# 请替换为你自己的京东联盟凭证
jd.union.app-key=${JD_UNION_APP_KEY:}
jd.union.app-secret=${JD_UNION_APP_SECRET:}
jd.union.api-key=${JD_UNION_API_KEY:}
jd.union.promotion-id=${JD_UNION_PROMOTION_ID:}

# ========== 默认管理员配置 ==========
admin.default.username=${ADMIN_DEFAULT_USERNAME:admin}
admin.default.password=${ADMIN_DEFAULT_PASSWORD:admin123}