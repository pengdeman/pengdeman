version: '3.8'

services:
  pengdeman:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pengdeman-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/app/logs
    networks:
      - pengdeman-network

networks:
  pengdeman-network:
    driver: bridge